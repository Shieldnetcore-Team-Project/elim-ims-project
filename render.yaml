services:
  - type: web
    name: bluesprint-ims
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Secret values are set in the Render dashboard, not committed here.
      # The VITE_-prefixed vars must exist at build time (inlined into the client bundle).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_ID
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PROJECT_ID
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
