# Render Blueprint: deploys both the static frontend and the Express API.
# Deploy: in Render, New -> Blueprint -> connect this repo. It will create
# both services from this file. (Manual services ignore render.yaml, so use
# the Blueprint flow or set the values below by hand in each service.)

services:
  # --- Frontend (static site) ---
  - type: web
    name: elim-ims-project
    runtime: static
    # Repo root is the workspace root; build only the client workspace.
    buildCommand: npm install && npm run build -w client
    # Vite is configured to output to repo-root dist.
    staticPublishPath: dist
    pullRequestPreviews: true
    # Set this to the deployed API URL (e.g. https://elim-erp-api.onrender.com)
    # in the Render dashboard after the API service is live. Vite inlines it
    # at build time, so update + redeploy the static site when it changes.
    envVars:
      - key: VITE_API_URL
        sync: false

  # --- Backend API (web service) ---
  # Self-contained Express API using Node's built-in SQLite (node:sqlite).
  # It migrates + seeds its own DB at boot, so no external database is needed.
  - type: web
    name: elim-erp-api
    runtime: node
    rootDir: server
    # NOTE: Render Disks require a paid instance, so this is "starter", not
    # "free". Downgrade to free only if you accept ephemeral (reset-on-restart)
    # data, and remove the `disks:` block below.
    plan: starter
    buildCommand: npm install && npm run build
    # node:sqlite needs the --experimental-sqlite flag on Node 22.x.
    startCommand: node --experimental-sqlite dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Persist SQLite on the attached disk (see `disks:` below).
      - key: ELIM_DB_PATH
        value: /data/elim.db
    # Persistent disk so the SQLite DB survives deploys/restarts. Mounted at
    # /data; ELIM_DB_PATH points the DB file there.
    disks:
      - name: elim-api-data
        mountPath: /data
        sizeGB: 1
