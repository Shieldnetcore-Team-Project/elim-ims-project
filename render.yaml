# Render deployment config for the static frontend (client/).
# Deploy: connect this repo in Render and it will use these settings,
# or create a "Static Site" manually with the same values.

services:
  - type: web
    name: elim-include-project
    runtime: static
    # Repo root is the workspace root; build only the client workspace.
    buildCommand: npm install && npm run build -w client
    # Vite is configured to output to repo-root dist.
    staticPublishPath: dist
    pullRequestPreviews: true
